<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIONN.COM — Real-Browser Master Checkout & Forensic Audit</title>
  <style>
    :root {
      --bg: #050608;
      --sidebar-bg: #0a0c10;
      --card-bg: #0f131a;
      --border: #1e2636;
      --accent: #ff3366;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --certified: #10b981;
      --partial: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Left Navigation Sidebar */
    .sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .brand-badge {
      background: rgba(255, 51, 102, 0.15);
      color: var(--accent);
      border: 1px solid rgba(255, 51, 102, 0.3);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .brand-header h2 { font-size: 1.25rem; font-weight: 900; margin-top: 0.5rem; }
    .brand-header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    
    .section-nav {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .nav-label {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 0.75rem 0 0.5rem 0.5rem;
      letter-spacing: 0.05em;
    }
    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.35rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
    .nav-btn.active {
      background: rgba(255, 51, 102, 0.12);
      border-color: rgba(255, 51, 102, 0.4);
      color: #fff;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-certified { background: var(--certified); box-shadow: 0 0 6px var(--certified); }
    .dot-partial { background: var(--partial); box-shadow: 0 0 6px var(--partial); }
    
    /* Main Content Area */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: #080a0f;
    }
    .toolbar-title { font-size: 1.1rem; font-weight: 800; }
    .toolbar-tools { display: flex; gap: 0.75rem; align-items: center; }
    
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    
    .viewport-content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }
    
    /* Side-by-Side Comparison Container */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
      height: calc(100vh - 160px);
    }
    .pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      padding: 0.85rem 1.25rem;
      background: #0d1117;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .pane-body {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: none; }
    img.source-view { width: 100%; height: 100%; object-fit: contain; background: #000; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand-header">
      <span class="brand-badge">AUTHENTIC EVIDENCE AUDIT</span>
      <h2>TRIONN.COM CHECKOUT</h2>
      <p>Target: https://trionn.com/</p>
    </div>
    
    <div class="section-nav">
      <div class="nav-label">Source Navigation</div>
      <button class="nav-btn active" onclick="showOverview()">
        <span>00. Full Page Source Overview</span>
        <span class="status-dot dot-certified"></span>
      </button>
      
      <div class="nav-label">Discovered Sections (6)</div>
      
      <button class="nav-btn" onclick="selectSection(0)">
        <span>01. HeroShowcaseSection</span>
        <span class="status-dot dot-partial"></span>
      </button>

      <button class="nav-btn" onclick="selectSection(1)">
        <span>02. VideoShowreelSection</span>
        <span class="status-dot dot-certified"></span>
      </button>

      <button class="nav-btn" onclick="selectSection(2)">
        <span>03. VideoShowreelSection</span>
        <span class="status-dot dot-certified"></span>
      </button>

      <button class="nav-btn" onclick="selectSection(3)">
        <span>04. Section_24</span>
        <span class="status-dot dot-certified"></span>
      </button>

      <button class="nav-btn" onclick="selectSection(4)">
        <span>05. Interactive3DExperience</span>
        <span class="status-dot dot-partial"></span>
      </button>

      <button class="nav-btn" onclick="selectSection(5)">
        <span>06. Interactive3DExperience</span>
        <span class="status-dot dot-partial"></span>
      </button>
    </div>
  </aside>

  <!-- Main Stage -->
  <main class="main-stage">
    <header class="toolbar">
      <div class="toolbar-title" id="active-title">Full Page Source Overview vs Reproduction</div>
      <div class="toolbar-tools">
        <button class="tab-btn active" onclick="setMode('side-by-side')">Side-by-Side</button>
        <button class="tab-btn" onclick="setMode('reproduction-only')">Reproduction Only</button>
        <a href="https://trionn.com/" target="_blank" class="tab-btn" style="text-decoration:none;">Open Live Source ↗</a>
      </div>
    </header>

    <div class="viewport-content">
      <div class="comparison-grid" id="comparison-stage">
        <!-- Left: Source Evidence -->
        <div class="pane">
          <div class="pane-header">
            <span>🔴 SOURCE BROWSER CAPTURE</span>
            <span style="color:var(--text-muted); font-family:monospace;">1440x900</span>
          </div>
          <div class="pane-body">
            <img id="source-img" class="source-view" src="../source/desktop-0.png" alt="Source" />
          </div>
        </div>

        <!-- Right: Clean-Room Reproduction -->
        <div class="pane">
          <div class="pane-header">
            <span>🟢 EXTRACTED REPRODUCTION</span>
            <span style="color:var(--certified); font-family:monospace;" id="cert-status">COPY_USE_CERTIFIED</span>
          </div>
          <div class="pane-body">
            <iframe id="rep-frame" src="../reproduction/01-HeroShowcaseSection/index.html"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const sections = [{"index":1,"id":"sec-02-hero","name":"HeroShowcaseSection","category":"hero","tag":"div","rect":{"x":0,"y":0,"width":1440,"height":4500},"status":"COPY_USE_PARTIAL","assets":1,"animations":"Three.js / WebGL","interactions":"3 elements","previewUrl":"./packages/01-HeroShowcaseSection/index.html","sourceScreenshot":"./packages/01-HeroShowcaseSection/evidence/screenshots/source-desktop.png"},{"index":2,"id":"sec-10-video","name":"VideoShowreelSection","category":"video","tag":"section","rect":{"x":0,"y":3600,"width":1440,"height":1081},"status":"COPY_USE_CERTIFIED","assets":15,"animations":"GSAP","interactions":"None","previewUrl":"./packages/02-VideoShowreelSection/index.html","sourceScreenshot":"./packages/02-VideoShowreelSection/evidence/screenshots/source-desktop.png"},{"index":3,"id":"sec-14-video","name":"VideoShowreelSection","category":"video","tag":"div","rect":{"x":0,"y":4681,"width":1440,"height":13050},"status":"COPY_USE_CERTIFIED","assets":9,"animations":"GSAP","interactions":"9 elements","previewUrl":"./packages/03-VideoShowreelSection/index.html","sourceScreenshot":"./packages/03-VideoShowreelSection/evidence/screenshots/source-desktop.png"},{"index":4,"id":"sec-24-section","name":"Section_24","category":"section","tag":"section","rect":{"x":0,"y":16831,"width":1440,"height":983},"status":"COPY_USE_CERTIFIED","assets":5,"animations":"GSAP","interactions":"9 elements","previewUrl":"./packages/04-Section_24/index.html","sourceScreenshot":"./packages/04-Section_24/evidence/screenshots/source-desktop.png"},{"index":5,"id":"sec-38-canvas","name":"Interactive3DExperience","category":"canvas","tag":"div","rect":{"x":0,"y":17812,"width":1440,"height":6750},"status":"COPY_USE_PARTIAL","assets":0,"animations":"Three.js / WebGL","interactions":"1 elements","previewUrl":"./packages/05-Interactive3DExperience/index.html","sourceScreenshot":"./packages/05-Interactive3DExperience/evidence/screenshots/source-desktop.png"},{"index":6,"id":"sec-39-ca     function selectSection(idx) {
      const sec = sections[idx];
      document.getElementById('active-title').innerText = sec.index.toString().padStart(2, '0') + '. ' + sec.name;
      document.getElementById('source-img').src = sec.sourceScreenshot;
      document.getElementById('rep-frame').src = sec.previewUrl;
      document.getElementById('cert-status').innerText = sec.status;
      document.getElementById('cert-status').style.color = sec.status === 'COPY_USE_CERTIFIED' ? '#10b981' : '#f59e0b';
      
      document.querySelectorAll('.nav-btn').forEach((btn, i) => {
        if (i === idx + 1) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    function showOverview() {
      document.getElementById('active-title').innerText = 'Full Page Source Overview vs Clean-Room Package Stack';
      document.getElementById('source-img').src = '../source/desktop-0.png';
      document.getElementById('rep-frame').src = '../reproduction/01-HeroShowcaseSection/index.html';
      document.querySelectorAll('.nav-btn').forEach((btn, i) => {
        if (i === 0) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }
  </script>
</body>
</html>
