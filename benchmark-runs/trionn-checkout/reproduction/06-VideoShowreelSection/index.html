<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoShowreelSection — Trionn Standalone Section</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
      .video-section-box {
        background: #000;
        padding: 5rem 2rem;
        display: flex;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .video-container {
        width: 100%;
        max-width: 1200px;
        aspect-ratio: 16/9;
        background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .reel-center-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.05em;
        font-size: 1rem;
      }
      .play-circle {
        width: 70px;
        height: 70px;
        background: #ff3366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .video-container:hover .play-circle {
        transform: scale(1.15);
      }
    
  </style>
</head>
<body>
  
      <div class="video-section-box">
        <div class="video-container">
          <div class="video-poster-layer">
            <div class="reel-center-cta">
              <div class="play-circle">▶</div>
              <span>WATCH SHOWREEL 2026</span>
            </div>
          </div>
        </div>
      </div>
    
</body>
</html>
