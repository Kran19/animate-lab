<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AboutAgencySection — Trionn Standalone Section</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
      .about-wrapper {
        background: #0d0f14;
        color: #fff;
        padding: 7rem 2rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .about-container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .about-label {
        color: #ff3366;
        font-family: monospace;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
      }
      .about-heading {
        font-size: clamp(2rem, 4.5vw, 3.5rem);
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.02em;
        margin-bottom: 4rem;
        color: #f1f5f9;
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 3rem;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 2rem;
        border-radius: 12px;
      }
      .stat-num {
        font-size: 3rem;
        font-weight: 900;
        color: #ff3366;
        margin-bottom: 0.5rem;
      }
      .stat-desc {
        color: #94a3b8;
        font-size: 0.95rem;
      }
    
  </style>
</head>
<body>
  
      <div class="about-wrapper">
        <div class="about-container">
          <div class="about-label">WHO WE ARE</div>
          <h2 class="about-heading">
            We are a collective of digital craftsmen, designers, and creative engineers. We bridge imagination and performance to create experiences that define industry standards.
          </h2>
          <div class="stats-row">
            <div class="stat-card">
              <div class="stat-num">120+</div>
              <div class="stat-desc">Awwwards & FWA Honors</div>
            </div>
            <div class="stat-card">
              <div class="stat-num">14+</div>
              <div class="stat-desc">Years Crafting Digital Excellence</div>
            </div>
            <div class="stat-card">
              <div class="stat-num">99.4%</div>
              <div class="stat-desc">Client Retention & Satisfaction</div>
            </div>
          </div>
        </div>
      </div>
    
</body>
</html>
