<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeroSection — Trionn Standalone Section</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
      .trionn-hero-wrap {
        position: relative;
        min-height: 100vh;
        background: #08090c;
        color: #fff;
        padding: 6rem 3rem 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
        overflow: hidden;
      }
      .hero-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(255, 51, 102, 0.18) 0%, rgba(8, 9, 12, 0) 70%);
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .hero-meta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 0.4rem 1rem;
        border-radius: 9999px;
        font-family: monospace;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        margin-bottom: 2rem;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        background: #ff3366;
        border-radius: 50%;
        box-shadow: 0 0 10px #ff3366;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .hero-headline {
        font-size: clamp(2.75rem, 6.5vw, 6rem);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin: 0 0 1.5rem;
      }
      .gradient-text {
        background: linear-gradient(135deg, #ff3366 0%, #ff6b8b 50%, #ffffff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero-subtext {
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        color: #94a3b8;
        max-width: 680px;
        line-height: 1.6;
        margin: 0 auto 3rem;
      }
      .hero-cta-group {
        display: flex;
        gap: 1.25rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: #ff3366;
        color: #fff;
        text-decoration: none;
        padding: 1.1rem 2.25rem;
        border-radius: 9999px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
      }
      .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(255, 51, 102, 0.4);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 1.1rem 2.25rem;
        border-radius: 9999px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }
      .hero-footer-strip {
        margin-top: 5rem;
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: #64748b;
        font-family: monospace;
        letter-spacing: 0.05em;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 1.5rem;
      }
    
  </style>
</head>
<body>
  
      <div class="trionn-hero-wrap">
        <div class="hero-glow"></div>
        <div class="hero-meta">
          <span class="pulse-dot"></span>
          <span>FORWARD-THINKING DIGITAL EXPERIENCES</span>
        </div>
        <h1 class="hero-headline">
          WE SHAPE DIGITAL<br/>
          <span class="gradient-text">FUTURES & BRANDS</span>
        </h1>
        <p class="hero-subtext">
          Award-winning design & development studio crafting world-class digital products, WebGL experiences, and brand narratives.
        </p>
        <div class="hero-cta-group">
          <a href="#work" class="btn-primary" id="magnetic-reel-btn">
            <span>EXPLORE WORK</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
          </a>
          <button class="btn-secondary" id="play-showreel-btn">
            <span class="play-icon">▶</span>
            <span>PLAY SHOWREEL</span>
          </button>
        </div>
        <div class="hero-footer-strip">
          <div>TOP RATED AGENCY • AWWWARDS SITE OF THE DAY • 2026</div>
          <div>SCROLL TO DISCOVER ↓</div>
        </div>
      </div>
    
</body>
</html>
