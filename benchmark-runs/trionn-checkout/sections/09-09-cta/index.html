<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CallToActionSection — Trionn Standalone Section</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
      .cta-wrapper {
        background: #ff3366;
        color: #fff;
        padding: 8rem 2rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .cta-box { max-width: 900px; margin: 0 auto; }
      .cta-badge {
        background: #08090c;
        color: #fff;
        font-family: monospace;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 0.35rem 0.8rem;
        border-radius: 9999px;
        display: inline-block;
        margin-bottom: 1.5rem;
      }
      .cta-box h2 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 1rem;
        color: #fff;
      }
      .cta-box p {
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        margin: 0 0 3rem;
        opacity: 0.95;
      }
      .big-cta-btn {
        background: #08090c;
        color: #fff;
        text-decoration: none;
        padding: 1.25rem 3rem;
        border-radius: 9999px;
        font-weight: 800;
        font-size: 1.15rem;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        transition: transform 0.2s, background 0.2s;
      }
      .big-cta-btn:hover {
        transform: scale(1.06);
        background: #111;
      }
    
  </style>
</head>
<body>
  
      <div class="cta-wrapper">
        <div class="cta-box">
          <span class="cta-badge">START A PROJECT</span>
          <h2>HAVE A VISION IN MIND?</h2>
          <p>Let's collaborate to build something extraordinary together.</p>
          <a href="mailto:hello@trionn.com" class="big-cta-btn">
            <span>START A CONVERSATION</span>
            <span class="arrow">→</span>
          </a>
        </div>
      </div>
    
</body>
</html>
