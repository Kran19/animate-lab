<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NibSplitHero — Standalone Section Preview</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nib-hero { height: 100vh; display: grid; grid-template-columns: 1fr 1fr; font-family: 'Impact', sans-serif; text-transform: uppercase; font-size: 3.5rem; } .left { background: #fff; color: #000; display: flex; align-items: center; justify-content: center; } .right { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <section class="nib-hero"><div class="left"><h1>NORMAL</h1></div><div class="right"><h1>IS BORING</h1></div></section>
</body>
</html>
