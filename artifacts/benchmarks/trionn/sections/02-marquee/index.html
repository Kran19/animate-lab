<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfiniteMarqueeSection — Standalone Section Preview</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .marquee-sec { background: #ff3366; padding: 1.5rem 0; overflow: hidden; white-space: nowrap; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.75rem; color: #000; } .track { display: inline-block; animation: scroll-left 15s linear infinite; } @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  </style>
</head>
<body>
  <section class="marquee-sec"><div class="track">STRATEGY • DESIGN • 3D MOTION • DEVELOPMENT • WEBGL •</div></section>
</body>
</html>
