<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InteractiveGallerySection — Standalone Section Preview</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

</head>

  <section class="gallery-sec"><div class="track"><div class="slide">01</div><div class="slide">02</div><div class="slide">03</div></div></section>
